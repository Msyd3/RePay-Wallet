<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff0060">
  <meta name="referrer" content="no-referrer">
  <title>RePay | تعذر إتمام العملية</title>
  <meta name="description" content="راجع بيانات المرسل والمستفيد قبل متابعة الدفع عبر RePay.">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pages/failure.js" defer></script>
</head>
<body class="failure-body">
  <main class="success-page failure-page" aria-labelledby="result-message">
    <section class="success-content" aria-live="polite" aria-busy="false" id="result">
      <img class="success-icon" id="failure-icon" src="assets/circle-x.svg" alt="" width="180" height="180">

      <h1 id="result-message">تعذر إتمام العملية</h1>
      <p class="failure-description" id="failure-description">لم نتمكن من إتمام العملية. يرجى المحاولة مرة أخرى</p>
    </section>
    <a class="return-button" id="return-button" href="https://repay.sa">الرئيسية</a>
  </main>
</body>
</html>
