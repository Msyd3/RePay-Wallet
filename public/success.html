<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <title>RePay | نتيجة العملية</title>
  <meta name="description" content="راجع بيانات المرسل والمستفيد قبل متابعة الدفع عبر RePay.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pages/success.js" defer></script>
</head>
<body>
  <main class="success-page" aria-labelledby="result-message">
    <section class="success-content" aria-live="polite" aria-busy="true" id="result">
      <img class="success-icon" id="success-icon" hidden src="assets/circle-check.svg" alt="" width="180" height="180">
      <p class="success-amount" id="success-amount" hidden><img src="assets/sar.svg" width="28" height="32" alt="ريال سعودي"><bdi id="success-value"></bdi></p>
      <h1 id="result-message">جارٍ التحقق من حالة العملية…</h1>
    </section>
    <a class="return-button" id="return-button" href="https://repay.sa">عودة</a>
  </main>
</body>
</html>
