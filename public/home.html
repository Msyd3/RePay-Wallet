<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <title>RePay | الرئيسية</title>
  <meta name="description" content="راجع بيانات المرسل والمستفيد قبل متابعة الدفع عبر RePay.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js"></script>
  <script src="js/config.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/pages/home.js" defer></script>
  <script src="js/banking.js"></script>
  <script src="js/pages/bank-account.js" defer></script>
</head>
<body>
<main class="home-page">
  <header class="home-header"><a href="https://repay.sa" aria-label="RePay"><img src="assets/repay-logo.png" width="48" height="48" alt="RePay"></a><div class="account-control"><button type="button" class="home-avatar" id="account-toggle" aria-label="حساب محمد" aria-expanded="false" aria-controls="account-menu">M</button><div id="account-menu" class="account-menu" hidden><a href="profile.html">الصفحة الشخصية</a><button type="button" id="logout-button">تسجيل خروج</button><button type="button" id="home-language">English</button></div></div></header>
  <section class="balance-card" aria-labelledby="balance-title"><h1 id="balance-title">الرصيد</h1><p><img src="assets/sar.svg" width="30" height="34" alt="ريال سعودي"><bdi id="balance-value">—</bdi></p></section>
  <div class="home-actions"><button id="transfer-button" type="button">تحويل سريع</button><button id="withdraw-button" type="button">سحب</button></div>
  <p id="home-status" role="status" hidden></p>
  <section class="transactions"><h2>العمليات</h2><div id="transaction-list"></div></section>
</main>
<dialog id="bank-sheet" class="bank-sheet" aria-labelledby="bank-title">
<button class="sheet-handle" id="bank-resize" type="button" aria-label="توسيع الشيت" aria-expanded="false"></button>
<div class="bank-sheet-header"><h2 id="bank-title">إضافة حساب بنكي</h2><button id="bank-close" type="button" aria-label="إغلاق">×</button></div>
<div id="bank-saved" hidden><div id="bank-account-list"></div><button type="button" id="bank-add">+ إضافة حساب إضافي</button></div>
<form id="bank-form">
<label for="bank-iban">الآيبان</label><div class="iban-input-wrap"><input id="bank-iban" name="iban" type="text" inputmode="text" placeholder="SA00 0000 0000 0000 0000 0000" maxlength="29" autocomplete="off" dir="ltr" required><button type="button" id="bank-paste">لصق</button></div>
<label for="bank-holder">الاسم الكامل</label><input id="bank-holder" name="accountHolder" type="text" placeholder="الاسم كما هو مسجّل في البنك" maxlength="120" autocomplete="name" required>
<button id="bank-save" type="submit" disabled>حفظ الحساب</button>
<button type="button" id="bank-form-cancel" hidden>رجوع</button>
</form>
<p id="bank-status" role="status" hidden></p>
</dialog>
</body>
</html>
