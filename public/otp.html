<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <title>RePay | رمز التحقق</title>
  <meta name="description" content="راجع بيانات المرسل والمستفيد قبل متابعة الدفع عبر RePay.">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pages/otp.js" defer></script>
</head>
<body>
<main class="login-page otp-page">
<a class="otp-back" href="login.html" aria-label="رجوع">‹</a>
<a class="login-logo" href="https://repay.sa" aria-label="RePay"><img src="assets/repay-logo.png" width="128" height="128" alt="RePay"></a>
<form id="otp-form">
<div class="login-field"><label for="otp-code">أدخل رمز التحقق المرسل لك</label><input id="otp-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="" minlength="6" maxlength="6" pattern="[0-9]{6}" required aria-describedby="login-status"><div class="otp-resend"><button id="resend-code" type="button" disabled>إعادة إرسال رمز التحقق <span id="resend-timer">01:00</span></button></div></div>
<p id="login-status" role="status" hidden></p>
<button id="login-next" type="submit" disabled>التالي</button>
</form>
</main>
</body></html>
